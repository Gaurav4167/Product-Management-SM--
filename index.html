<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">
    <link rel="stylesheet" href="./assets/css/style.css">
    <title>Product Management</title>
</head>
<body>
    
    <div class="container">
        <div class="row mt-5">
            <div class="col-10 offset-1">
                 <div class="row">
                <div class="col-4 offset-4">
                    <h4 class="color-red"><b>*Product Management*</b></h4>
                </div>
             </div>
                <div class="card bg-pink">
                    <div class="card-body">
                        <form id="form">
                            
                            <div class="row">
                                <div class="col-3">
                                      <label class="form-label" for="productName"><b>Name:</b></label>
                                      <input class="form-control" id="productName" type="text" placeholder="Product Name">
                                </div>

                                <div class="col-3">    
                                     <label class="form-label" for="category"><b>Category</b></label>
                                     <select class="form-select form-control" name="category" id="category">
                                           <option value="Electronics">Electronics</option>
                                           <option value="Clothing">Clothing</option>
                                          <option value="Books">Books</option>
                                          <option value="Shoes">Shoes</option>
                                     </select>
                                </div>

                                <div class="col-3">
                                      <label class="form-label" for="price"><b>Price</b></label>
                                      <input class="form-control" id="price" type="number" min="1" placeholder="Price">
                                </div>

                                <div class="col-3">
                                     <label class="form-label" for="stock"><b>Stock</b></label>
                                     <input class="form-control" id="stock" type="number" min="0" placeholder="Stock">
                                </div>
                            </div>
                            <div class="mt-4">
                                <div class="d-flex justify-content-end ">
                                    <button id="addBtn" class="btn btn-warning shadow">Add</button>
                                    <button type="button" id="updateBtn" class="btn btn-warning shadow ml-3 d-none">Update</button>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
        <div class="row mt-5">
            <div class="col-10 offset-1">
            
                <table class="table table-bordered table-hover table-light">
                    <thead class="table-dark text-align-center">
                        <tr>
                            <th>Sr. No</th>
                            <th>Product</th>
                            <th>Category</th>
                            <th>Price</th>
                            <th>Stock</th>
                            <th>Edit</th>
                            <th>Delete</th>
                        </tr>
                    </thead>
                    <tbody class="text-align-center" id="tbody">
                        <!-- <tr>
                            <td>1</td>
                            <td>Laptop</td>
                            <td>Electronics</td>
                            <td class="color-blue">48000</td>
                            <td class="color-green">23</td>
                            <td><button class="btn btn-warning">Edit</button></td>
                            <td><button class="btn btn-danger">Delete</button></td>
                        </tr> -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>
    <script src="./assets/js/app.js"></script>
</body>
</html>
